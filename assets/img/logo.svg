<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Background -->
  <rect width="200" height="60" fill="transparent"/>
  
  <!-- Globe/Network Symbol -->
  <circle cx="30" cy="30" r="20" fill="none" stroke="#0066b3" stroke-width="2"/>
  <ellipse cx="30" cy="30" rx="20" ry="10" fill="none" stroke="#0066b3" stroke-width="1.5"/>
  <ellipse cx="30" cy="30" rx="10" ry="20" fill="none" stroke="#0066b3" stroke-width="1.5"/>
  <line x1="10" y1="30" x2="50" y2="30" stroke="#0066b3" stroke-width="1.5"/>
  
  <!-- Network nodes -->
  <circle cx="30" cy="10" r="3" fill="#ff6b35"/>
  <circle cx="50" cy="30" r="3" fill="#ff6b35"/>
  <circle cx="30" cy="50" r="3" fill="#0066b3"/>
  <circle cx="10" cy="30" r="3" fill="#0066b3"/>
  
  <!-- Text: "connect" -->
  <text x="60" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0066b3">connect</text>
  
  <!-- Text: "community" -->
  <text x="60" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff6b35">community</text>
